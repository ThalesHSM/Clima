<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar · Clima em Ação</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
    <div class="inner">
        <a class="brand" href="index.html">🌍 Clima em Ação</a>
    </div>
</header>

<main>
    <div class="auth-box">
        <form class="card" id="auth-form" data-mode="login">
            <h1>Entrar</h1>
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required>
            <div class="msg error" id="error" hidden></div>
            <button class="btn" type="submit">Entrar</button>
            <p class="alt">Não tem conta? <a href="register.html">Criar conta</a></p>
        </form>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
