<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta · Clima em Ação</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
    <div class="inner">
        <a class="brand" href="index.html">🌍 Clima em Ação</a>
    </div>
</header>

<main>
    <div class="auth-box">
        <form class="card" id="auth-form" data-mode="register">
            <h1>Criar conta</h1>
            <label for="name">Nome</label>
            <input type="text" id="name" name="name" required>
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>
            <label for="password">Senha (mín. 6 caracteres)</label>
            <input type="password" id="password" name="password" minlength="6" required>
            <div class="msg error" id="error" hidden></div>
            <button class="btn" type="submit">Criar conta</button>
            <p class="alt">Já tem conta? <a href="login.html">Entrar</a></p>
        </form>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
